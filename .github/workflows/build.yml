name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create keystore.properties
      run: |
        echo "storeFile=keystore/alexandria-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=alexandria" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        # also place a copy where the app module can definitely find it
        cp keystore.properties app/keystore.properties

    - name: Verify keystore credentials
      run: |
        ls -la app/keystore || true
        # validate store password and alias; exit non-zero if wrong
        keytool -list -keystore app/keystore/alexandria-release.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -alias alexandria \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          -v
      shell: bash

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: alexandria-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 14

    - name: Prepare release notes
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        NOTES_FILE="release_notes_${{ github.ref_name }}.md"
        if [ -f "$NOTES_FILE" ]; then
          cp "$NOTES_FILE" release_body.md
        else
          echo "Release ${{ github.ref_name }}" > release_body.md
        fi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        body_path: release_body.md
        files: app/build/outputs/apk/release/app-release.apk
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
